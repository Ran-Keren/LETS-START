<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Start</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; background-color: #121212; color: white; font-family: sans-serif;
            overscroll-behavior: none; overflow: hidden; touch-action: none; 
            -webkit-user-select: none; user-select: none;
        }
        #gameBtn { 
            padding: 40px 80px; font-size: 24px; background-color: grey; 
            border: none; cursor: pointer; color: white; border-radius: 10px;
            transition: transform 0.1s, background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #display { font-size: 100px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <button id="gameBtn">Start the Game</button>
    <div id="display">1:38</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxABjgEt76G2GOOvEoqSRWAix-4vifpkA",
            authDomain: "lets-start-123.firebaseapp.com",
            projectId: "lets-start-123",
            storageBucket: "lets-start-123.firebasestorage.app",
            messagingSenderId: "550987287652",
            appId: "1:550987287652:web:7d47f290c5215f4fc02371",
            databaseURL: "https://lets-start-123-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const btn = document.getElementById('gameBtn');
        const display = document.getElementById('display');
        const myId = 'player' + Math.floor(Math.random() * 1000000);

        btn.addEventListener('touchstart', (e) => { 
            e.preventDefault();
            btn.style.backgroundColor = 'red'; 
            set(ref(db, 'game/' + myId), true);
        });

        btn.addEventListener('touchend', (e) => { 
            e.preventDefault();
            btn.style.backgroundColor = 'grey'; 
            set(ref(db, 'game/' + myId), false);
        });

        onValue(ref(db, 'game'), (snapshot) => {
            const data = snapshot.val() || {};
            const activePlayers = Object.values(data).filter(status => status === true);
            
            if (activePlayers.length >= 2) {
                document.body.style.backgroundColor = '#004d00';
                btn.style.display = 'none';
                display.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = "https://questify-3c0d7.web.app/";
                }, 5000);
            }
        });
    </script>
</body>
</html>
